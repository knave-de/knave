[package]
name = "knave-session"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Knave desktop session supervisor"

[[bin]]
name = "knave-session"
path = "src/main.rs"

[dependencies]
knave-config.workspace = true
knave-desktop-api.workspace = true
libc.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "signal"] }
rusqlite = "0.37"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
