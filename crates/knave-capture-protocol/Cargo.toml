[package]
name = "knave-capture-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Private Villain workspace image-source protocol"

[features]
client = ["dep:wayland-client", "wayland-protocols/client"]
server = ["dep:wayland-server", "wayland-protocols/server"]

[dependencies]
wayland-client = { version = "0.31", optional = true }
wayland-server = { version = "0.31", optional = true }
wayland-scanner = "0.31"
wayland-backend = "0.3"
wayland-protocols = { version = "0.32", features = ["staging"] }
