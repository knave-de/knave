[package]
name = "knave-wayland"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Knave-owned Wayland layer-shell runtime"

[dependencies]
knave-shell-ui.workspace = true
knave-apps.workspace = true
knave-renderer.workspace = true
knave-desktop-api.workspace = true
knave-ui.workspace = true
knave-config.workspace = true
knave-icons.workspace = true
base64.workspace = true
png.workspace = true
pollster.workspace = true
smithay-client-toolkit.workspace = true
xkbcommon.workspace = true
thiserror.workspace = true
wayland-client.workspace = true
wgpu.workspace = true
rustix = { version = "1", features = ["fs"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }

serde_json = "1"
serde = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "process"] }
futures-util = "0.3"
