name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Cargo verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native compositor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libinput-dev \
            libseat-dev \
            libudev-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb-composite0-dev \
            libxcb-damage0-dev \
            libxcb-render0-dev \
            libxcb-xfixes0-dev \
            libxcb-xinput-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxcursor-dev \
            libgles2-mesa-dev \
            wayland-protocols

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build release artifact
        run: cargo build --release --locked
