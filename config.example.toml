# Knave configuration schema 2
#
# Copy to ~/.config/knave/config.toml or run:
#   knave config init

schema_version = 2

[compositor]
# Villain consumes this typed projection; it does not own a second config file.
modkey = "Super"
# Master width in percent; stack receives the remainder (10..90).
master_percent = 50
environment_file = "environment"

[compositor.input]
tap_to_click = true
natural_scroll = true

# Explicit bindings replace the default set. Include MOD to retain Overview.
[[compositor.bind]]
keys = "MOD"
dispatch = "toggle-overview"
args = []

[[compositor.bind]]
keys = "MOD+Q"
dispatch = "close"
args = []

[session]
# auto selects the production backend once the session supervisor is complete.
# Other accepted values are tty and winit.
backend = "auto"
compositor_binary = "villain"
shell_binary = "knave-shell"
restart_on_failure = true

[shell]
start_bar = true
# Knave Session owns one hidden-until-requested Overview process.
start_overview_service = true

# Window appearance is optional; omitted values preserve the prior visuals.
# Full fields and visible-effect example: docs/architecture/window-appearance.md
[compositor.appearance.gaps.outer]
top = 0
right = 0
bottom = 0
left = 0
[compositor.appearance.gaps.inner]
top = 0
right = 0
bottom = 0
left = 0
[compositor.appearance.border.width]
top = 0
right = 0
bottom = 0
left = 0
[compositor.appearance.border.radius]
top_left = 0
top_right = 0
bottom_right = 0
bottom_left = 0
[compositor.appearance.views.maximized]
gaps = false
borders = false
radius = false
shadows = false
opacity = false
blur = false

[portal]
enabled = true
# 0 follows the theme, 1 prefers dark, 2 prefers light.
color_scheme = 0
accent_color = "0.21,0.52,0.89"
high_contrast = false
reduced_motion = false
