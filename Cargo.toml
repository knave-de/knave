[workspace]
members = [
    "crates/knave",
    "crates/knave-config",
    "crates/knave-desktop-api",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
knave-config = { path = "crates/knave-config" }
knave-desktop-api = { path = "crates/knave-desktop-api" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
toml_edit = { version = "0.23", features = ["serde"] }
